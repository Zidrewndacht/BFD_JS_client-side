<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />    
    <link rel="stylesheet" href="style.css" /> 
    <script src="scripts.js" defer></script>
</head>

<body> 
    <div class="wrapper" id="ret-wrapper">
        <h1>Calculadoraa área/perímetro</h1>
        <label>Lado A:</label>
        <input type="number" id="entrada-lado-a" >
        <label >Lado B:</label>
        <input type="number" id="entrada-lado-b" >
        <label >Área do retângulo correspondente:</label>
        <input type="text" id="result-area"  disabled></input>
        <label >Perímetro do retângulo correspondente:</label>
        <input type="text" id="result-perim" disabled></input>
        <!-- <button class="calcula-btn" id="calcula-ret">Calcular</button> -->
    </div>

    <div class="wrapper" id="ctof-wrapper">
        <h1>Conversor Celsius para Fahrenheit</h1>
        <label >Temperatura em Celsius:</label>
        <input type="number" id="entrada-tempc" >
        <label >Temperatura em Fahrenheit:</label>
        <input type="text" id="result-tempf" disabled>
        <!-- <button class="calcula-btn" id="calcula-tempf">Calcular</button> -->
    </div>

    <div class="wrapper" id="wrapper-3">
         <h1>Calculadora IMC</h1>

        <label for="altura">Altura (cm)</label>
        <input type="number" name="altura" id="altura">
        <label for="peso">Peso (kg)</label>
        <input type="number" name="peso" id="peso">

        <label for="valor-imc">Valor</label>
        <input type="text" name="valor-imc" id="valor-imc" disabled>

        <label for="resultado">Resultado</label>
        <input type="text" name="resultado" id="resultado" disabled>
        <button id="calcula-imc">Calcular</button>
    </div>

    <div class="wrapper" id="wrapper-4">
        <h1>Calculadora ano bissexto</h1>
        <label >Ano:</label>
        <input type="number" id="entrada-bis">
        <label >Resultado:</label>
        <input type="text" id="result-bis" disabled></input>
        <label >Resultado instantâneo.</label>
    </div>
</body>
</html>
